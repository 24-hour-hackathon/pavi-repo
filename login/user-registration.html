<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DocuMind | Create account</title>
  <link rel="stylesheet" href="css/auth-common.css" />
  <link rel="stylesheet" href="css/user-registration.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="registerTitle">
      <aside class="brand-panel"><div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span>documind</div><div class="brand-copy"><p>YOUR KNOWLEDGE, IN CONVERSATION</p><h1>Build your<br /><em>knowledge space.</em></h1><span>Create an account and start asking your approved documents.</span></div><div class="chat-hint">Ready when you are <b>✦</b></div></aside>
      <section class="form-panel">
        <nav class="page-switch"><a class="active" href="user-registration.html">User</a><a href="admin-login.html">Admin</a></nav>
        <p class="kicker">USER PORTAL</p><h2 id="registerTitle">Create your account</h2><p class="subheading">Start asking your documents in seconds.</p>
        <form id="userRegistrationForm" action="/api/auth/user/register" method="post" novalidate>
          <div class="field"><label for="userName">Username</label><input id="userName" name="username" type="text" autocomplete="username" placeholder="Choose a username" required /></div>
          <div class="field"><label for="userEmail">Email</label><input id="userEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /></div>
          <div class="field"><label for="userPassword">Password</label><input id="userPassword" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required /></div>
          <p id="registerMessage" class="form-message" role="alert"></p><button class="primary-button" type="submit">Register <span>→</span></button>
        </form>
        <p class="switch-link">Already registered? <a href="user-login.html">Log in here</a></p>
      </section>
    </section>
  </main>
  <script src="js/user-registration.js"></script>
</body>
</html>
